   {

  <script>
    const STORAGE_KEY = 'sc-wordbook:checked';
    const categories = JSON.parse(document.getElementById('word-data').textContent);

    const loadChecked = () => {
      try {
        return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? []);
      } catch {
        return new Set();
      }
    };
    const checked = loadChecked();
    const saveChecked = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...checked]));
      } catch {
        // localStorage が使えない環境（プライベートモード等）では保存しない
      }
    };

    const normalize = (s) => s.normalize('NFKC').toLowerCase();
    const main = document.getElementById('wordbook');
    const nav = document.getElementById('category-nav');
    const empty = document.getElementById('empty');
    const progress = document.getElementById('progress');
    const total = categories.reduce((n, c) => n + c.words.length, 0);

    const updateProgress = () => {
      progress.textContent = `${checked.size} / ${total}`;
    };

    const sections = categories.map((category, ci) => {
      const sectionId = `cat-${ci + 1}`;
      const section = document.createElement('section');
      section.className = 'category';
      section.id = sectionId;
      section.setAttribute('aria-labelledby', `${sectionId}-title`);

      const h2 = document.createElement('h2');
      h2.id = `${sectionId}-title`;
      h2.textContent = category.name;

      const navLink = document.createElement('a');
      navLink.href = `#${sectionId}`;
      navLink.textContent = category.name;
      nav.append(navLink);

      const ul = document.createElement('ul');
      ul.className = 'words';

      const items = category.words.map((word) => {
        const li = document.createElement('li');
        li.className = 'word';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = checked.has(word.id);
        checkbox.setAttribute('aria-label', `覚えた: ${word.term}`);
        checkbox.addEventListener('change', () => {
          checkbox.checked ? checked.add(word.id) : checked.delete(word.id);
          saveChecked();
          updateProgress();
        });

        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = word.term;
        const desc = document.createElement('p');
        desc.className = 'desc';
        // 句点のあとで改行する（文末の句点は除く）
        desc.textContent = word.desc.replace(/。(?=.)/g, '。\n');
        const source = document.createElement('p');
        source.className = 'source';
        source.textContent = `出典: ${word.source}`;
        details.append(summary, desc, source);
        li.append(checkbox, details);
        ul.append(li);

        // 検索対象は見出し語と出典の問題名（解説文は含めない）
        return { li, haystack: normalize(`${word.term}\n${word.source}`) };
      });

      section.append(h2, ul);
      main.insertBefore(section, empty);
      return { section, navLink, items };
    });

    // 保存済みIDのうちデータに存在しないものは件数から除外する
    const validIds = new Set(categories.flatMap((c) => c.words.map((w) => w.id)));
    for (const id of checked) if (!validIds.has(id)) checked.delete(id);
    updateProgress();

    const search = document.getElementById('search');
    search.addEventListener('input', () => {
      const query = normalize(search.value.trim());
      let anyVisible = false;
      for (const { section, navLink, items } of sections) {
        let visibleCount = 0;
        for (const { li, haystack } of items) {
          const match = query === '' || haystack.includes(query);
          li.hidden = !match;
          if (match) visibleCount++;
        }
        section.hidden = visibleCount === 0;
        navLink.hidden = visibleCount === 0;
        if (visibleCount) anyVisible = true;
      }
      empty.hidden = anyVisible;
    });

    // 固定ヘッダの高さをアンカー移動時のオフセットに反映する
    const header = document.querySelector('.site-header');
    new ResizeObserver(() => {
      document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
    }).observe(header);
  </script>
</body>
</html>
